  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <style>
    /* ------------------------------------------------------------
       Design idea: an engineer's blueprint.
       Deep blueprint-blue (dark) / drafting paper (light), a faint
       drawing grid, cyan "ink" as the main accent and one warm amber
       highlight reserved for the achievement.
       ------------------------------------------------------------ */
    :root {
      scroll-behavior: smooth;

      --bg: #0a1930;
      --grid-line: rgba(120, 180, 255, 0.07);
      --card: rgba(14, 33, 58, 0.88);
      --tile: rgba(120, 180, 255, 0.07);
      --tile-hover: rgba(120, 180, 255, 0.13);
      --line: rgba(140, 190, 255, 0.18);
      --text: #e6eefc;
      --muted: #9fb4d1;
      --heading: #ffffff;
      --accent: #5cc8ff;
      --accent-strong: #2da8ec;
      --accent-ink: #04203a;
      --amber: #ffb84d;
      --shadow: 0 24px 60px rgba(0, 8, 24, 0.45);

      --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body.light {
      --bg: #eef3f9;
      --grid-line: rgba(31, 95, 209, 0.09);
      --card: rgba(255, 255, 255, 0.92);
      --tile: rgba(31, 95, 209, 0.055);
      --tile-hover: rgba(31, 95, 209, 0.11);
      --line: rgba(20, 60, 120, 0.16);
      --text: #1a2c45;
      --muted: #52657f;
      --heading: #0b1d36;
      --accent: #1f5fd1;
      --accent-strong: #174aa6;
      --accent-ink: #ffffff;
      --amber: #c26a00;
      --shadow: 0 20px 50px rgba(20, 50, 100, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 32px 32px;
      background-attachment: fixed;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
    }

    a, button { font-family: inherit; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 8px;
    }

    ::selection { background: var(--accent); color: var(--accent-ink); }

    .container {
      display: flex;
      align-items: flex-start;
      gap: 28px;
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px;
      padding-top: 100px; /* Space for fixed top navbar */
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 44px 48px;
      box-shadow: var(--shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
      width: 100%;
      max-width: 1000px;
    }

    /* ---------- NAVBAR (floating pill) ---------- */
    .navbar {
      position: fixed;
      top: 14px;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: fit-content;
      max-width: calc(100% - 24px);
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 6px;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: 999px;
      z-index: 1000;
      box-shadow: var(--shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .navbar .toggle {
      padding: 9px 20px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.92rem;
      transition: background-color 0.2s ease, color 0.2s ease;
      text-align: center;
      white-space: nowrap;
    }

    .navbar .toggle:hover {
      background: var(--tile-hover);
      color: var(--heading);
    }

    .navbar .toggle.active {
      background: var(--accent);
      color: var(--accent-ink) !important;
    }

    /* ---------- SIDEBAR (profile card) ---------- */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: sticky;
      top: 88px;
      height: auto;
      width: 280px;
      flex-shrink: 0;
      order: 2;
      padding: 28px 26px;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid var(--accent);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .sidebar .personal-title {
      margin: 0 0 6px;
      font-size: 1.25rem;
    }

    .sidebar .personal-title::before { display: none; }

    .sidebar .grid {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-top: 4px;
    }

    .pGrid-item {
      padding: 11px 0;
      font-size: 0.93rem;
      line-height: 1.45;
      border-top: 1px solid var(--line);
      max-width: none;
    }

    .pGrid-item strong {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .pGrid-item:last-child strong { color: var(--amber); }

    /* ---------- TYPE ---------- */
    h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.8rem, 7vw, 4.6rem);
      line-height: 1;
      letter-spacing: -0.035em;
      color: var(--heading);
      margin: 0 0 18px;
      text-align: left;
    }

    .subtitle {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 8px;
      padding: 0;
      text-align: left;
    }

    .subtitle span {
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--tile);
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
      color: var(--heading);
      margin: 0 0 16px;
    }

    h2::before {
      content: "";
      width: 6px;
      height: 1.1em;
      border-radius: 3px;
      background: var(--accent);
      flex-shrink: 0;
    }

    p {
      line-height: 1.75;
      max-width: 70ch;
      margin: 0 0 14px;
      color: var(--text);
    }

    strong { font-weight: 700; }

    section {
      scroll-margin-top: 96px;
      margin-top: 36px;
      padding-top: 34px;
      border-top: 1px solid var(--line);
    }

    header + section {
      margin-top: 32px;
    }

    /* ---------- GRID TILES ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .grid-item {
      background: var(--tile);
      border: 1px solid var(--line);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.96rem;
      line-height: 1.5;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .grid-item:hover {
      background: var(--tile-hover);
      border-color: var(--accent);
    }

    /* Education: labelled facts */
    #education .grid-item {
      border-left: 3px solid var(--accent);
    }

    .grid-item strong {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 3px;
    }

    #education .grid-item:nth-child(6) {
      border-left-color: var(--amber);
    }

    #education .grid-item:nth-child(6) strong { color: var(--amber); }

    /* Projects: compact tiles */
    #projects .grid {
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    }

    #projects .grid-item {
      font-weight: 500;
    }

    /* Contact: roomier */
    #contact .grid-item {
      font-size: 1rem;
      padding: 18px 20px;
      overflow-wrap: anywhere;
    }

    /* ---------- FOOTER ---------- */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .footer-actions button, .footer-actions a {
      margin: 0;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--tile);
      color: var(--text);
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .footer-actions button:hover {
      background: var(--tile-hover);
      border-color: var(--accent);
    }

    .footer-actions a.github-link {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .footer-actions a.github-link:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    /* ---------- ONE PAGE-LOAD MOMENT: the hero ---------- */
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    header h1 { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    header .subtitle { animation: rise 0.7s 0.12s cubic-bezier(0.2, 0.7, 0.2, 1) both; }

    @media (prefers-reduced-motion: reduce) {
      :root { scroll-behavior: auto; }
      * { animation: none !important; transition: none !important; }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        align-items: center;
        padding: 16px;
        padding-top: 84px;
      }

      .card { padding: 30px 22px; }

      .sidebar {
        width: 100%;
        max-width: 1000px;
        order: 1;
        position: static;
      }

      .navbar {
        overflow-x: auto;
        justify-content: flex-start;
        scrollbar-width: none;
      }

      .navbar::-webkit-scrollbar { display: none; }

      .navbar .toggle {
        padding: 8px 14px;
        font-size: 0.86rem;
      }
    }
  </style>
</head>

  <script type="text/babel">
    function App() {
      const [light, setLight] = React.useState(false);

      React.useEffect(() => {
        document.body.classList.toggle("light", light);
      }, [light]);

      // Active nav highlighting for top navbar
      React.useEffect(() => {
        const sections = ['home', 'about', 'work', 'projects', 'contact'];
        const toggles = document.querySelectorAll('.navbar .toggle');

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const activeId = entry.target.getAttribute('id');
              toggles.forEach((toggle, index) => {
                toggle.classList.toggle('active', sections[index] === activeId);
              });
            }
          });
        }, { threshold: 0.3, rootMargin: '-20% 0px -40% 0px' });

        sections.forEach(id => {
          const section = document.getElementById(id);
          if (section) observer.observe(section);
        });

        return () => observer.disconnect();
      }, []);

      return (
        <div className="container" id="home">
          {/* FIXED TOP NAVBAR */}
          <nav className="navbar">
            <a className="toggle" href="#home">Home</a>
            <a className="toggle" href="#about">About</a>
            <a className="toggle" href="#work">Work</a>
            <a className="toggle" href="#projects">Projects</a>
            <a className="toggle" href="#contact">Contact</a>
          </nav>

          <div className="card">

              <div className="subtitle">
                <span>Student</span>
                <span>JS Backend Developer</span>
                <span>Robotics Enthusiast</span>
              </div>
            </header>

            <section id="about">
              <h2>About Me</h2>
              <p>I am a student at Delhi Public School Patna who is deeply interested in technology and computers. I enjoy learning how software works, how machines think, and how code can be used to solve real problems. I started with Python and slowly expanded my interests into robotics and Javascript development.</p>
              <p>I believe learning should be practical and curiosity-driven. I like experimenting, fixing errors, and asking a important question 'why'. My long-term goal is to become a skilled software and robotics engineer.</p>
            </section>

            <section id="education">
              <h2>Education</h2>
              <div className="grid">
                <div className="grid-item">
                  <strong>School:</strong> Delhi Public School, Patna
                </div>
                <div className="grid-item">
                  <strong>Class:</strong> 7-C
                </div>
                <div className="grid-item">
                  <strong>Board:</strong> CBSE

                  <strong>Focus Areas:</strong> Mathematics, Mental Abilities, Science
                </div>
                <div className="grid-item">
                  <strong>Academics:</strong><br></br> Class 5: 98.33%<br></br>Class 6: 98.6%
                </div>

                </div>

            </section>

            <section id="work">
              <h2>What I Work On</h2>
              <div className="grid">
                <div className="grid-item">🐍 Python Programming – ML (Neural Networks and other famous classification and regression algorithms)</div>
                <div className="grid-item">🔗 API Development – Using Express.js and Node.js</div>
                <div className="grid-item">🧠 Problem Solving – algorithms and logical thinking</div>
              </div>
            </section>

            <section id="family">
              <h2>Family Background</h2>
              <p>
                I was born and brought up in <strong>Patna, Bihar</strong>, where I am spending my childhood and educating myself to become more knowledge filled. While I grew up in Patna, my family's ancestral roots belong to <strong>Arah, Bhojpur district, Bihar</strong>, which forms an important part of our heritage and values.
              </p>
              <p>
                My father, <strong>Dr. Sanjay Kumar Roy, MBBS, DNB</strong>, is a doctor at <strong>Paras HMRI Hospital</strong> and has always emphasized discipline, dedication, and service to society. My mother, <strong>Kumari Anuradha</strong>, was a botany teacher by profession and now works as a lecturer at <strong>D.I.E.T, Nalanda, Nur Sarai(Noor Sarai)</strong>, contributing significantly to academic development and mentoring other educators. My elder sister, <strong>Ankita Roy</strong>, is academically driven and is determined to pursue a career in medicine and become a doctor.
              </p>
              <p>
                Growing up in such an education-oriented and supportive family environment has shaped my curiosity, work ethic, and interest in learning. The values of hard work, consistency, and continuous improvement that I learned at home strongly influence my approach to technology, studies, and personal growth.
              </p>
            </section>

                <div className="grid-item">🏺JavaScript Basics</div>
